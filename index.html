<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Tahona · Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">☕</div>
    <h1 class="login-title">la Tahona</h1>
    <p class="login-sub">Sistema de gestión de la cafetería</p>

    <form id="loginForm" novalidate>
      <div class="field" id="fUser">
        <label for="username">Usuario</label>
        <input type="text" id="username" autocomplete="username" placeholder="ej. admin">
        <div class="field-error">Ingresa tu usuario.</div>
      </div>

      <div class="field" id="fPass">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
        <div class="field-error">Ingresa tu contraseña.</div>
      </div>

      <div class="field" id="fCaptcha">
        <label>Verificación</label>
        <div class="captcha-box">
          <span class="captcha-question" id="captchaQuestion">¿Cuánto es ? + ?</span>
          <input type="number" id="captchaAnswer" placeholder="Resultado">
        </div>
        <div class="field-error">Respuesta incorrecta, intenta de nuevo.</div>
      </div>

      <button type="submit" class="btn btn-gold login-btn">Ingresar</button>
    </form>

    <p class="login-hint">
      Usuarios demo: admin/admin123 · mesero/mesero123<br>
      cocina/cocina123 · despacho/despacho123
    </p>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="app.js"></script>
</body>
</html>
